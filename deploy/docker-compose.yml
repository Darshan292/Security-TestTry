# THREAT_MODEL T13: "Apps bypass gateway and call providers directly".
# ADR-0001 binding rule 1: only the gateway holds provider keys, and only the
# gateway can reach providers. Two properties are enforced here, so that
# "please use the gateway" becomes "you cannot not use the gateway":
#   1. Application containers live ONLY on `appnet`, an `internal: true` network
#      (no default route, no NAT): they cannot reach the internet or any provider.
#   2. Only the gateway is also attached to `egressnet` (a normal bridge with a
#      route out) and only the gateway receives provider credentials.
# The gateway additionally enforces a destination allowlist in code
# (egress_allowlist in the signed registry/deployment.yaml / pgw.gateway.settings.check_destination).
#
# Network layer verified with real containers on 2026-10-02: see deploy/verify_network.sh
# and the "Verified 2026-10-02" section of deploy/README.md. Kubernetes is NOT exercised.

services:
  gateway:
    image: pgw-gateway:local          # build from the repo root; install with INSTALL.md
    command: ["python", "-m", "pgw.gateway"]
    environment:
      PGW_HOST: "0.0.0.0"
      PGW_PORT: "8080"
      # Provider, egress allowlist, NER and limits are NOT set here: in production they come only from the signed
      # deployment profile registry/deployment.yaml (set upstream_kind: anthropic and the provider attestation
      # there, review, re-sign). A PGW_* value here that differs from the profile stops startup.
      PGW_MODE: production               # default; development-only switches are refused (SECURITY_BOUNDARY.md)
      # Ed25519 public key that signed policies/MANIFEST.json (the repo manifest is unsigned: sign your own).
      PGW_TRUSTED_CONFIG_PUBKEY: "${PGW_TRUSTED_CONFIG_PUBKEY:?sign the config and set the trusted public key}"
      # Rollback floor: the config_serial of the signed configuration being deployed (same custody as the key).
      PGW_MIN_CONFIG_SERIAL: "${PGW_MIN_CONFIG_SERIAL:?set to the config_serial of the signed configuration}"
      PGW_STATE_DIR: /var/lib/pgw                         # config high-water mark (config_serial.json); must exist
      # Provider credentials: ONLY here. Supplied from the host env / .env, never baked in.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?set in the deploy environment}"
      PGW_MASTER_KEY_FILE: /run/secrets/pgw_master_key   # or PGW_MASTER_KEY from env
      PGW_REPLAY_DB: /var/lib/pgw/replay.sqlite          # single-use attestations; persistent, local disk only
    secrets: [pgw_master_key]
    volumes:
      - pgw_state:/var/lib/pgw        # replay store (and ledgers): must persist across restarts
    networks:
      appnet:
        aliases: [gateway]            # apps reach it as http://gateway:8080
      egressnet: {}
      privatenet: {}                  # reaches the in-boundary model (pgw-private-llm), nothing else
    restart: unless-stopped

  example-app:
    image: example-app:local
    environment:
      # The app only knows the gateway. It gets NO provider keys, and must not be
      # given any: a key in this container would be unusable (no route) but is still
      # a policy violation (T13 "shadow API keys held by app teams").
      LLM_BASE_URL: "http://gateway:8080"
      GATEWAY_APP_KEY: "${EXAMPLE_APP_GATEWAY_KEY:-}"
    networks: [appnet]                # appnet ONLY; never add egressnet to an app service
    depends_on: [gateway]

  hr-workspace:
    # HR Workspace (docs/WORKSPACE.md): the staff UI and its backend. Like every app it sits on `appnet` ONLY: it
    # reaches the gateway and nothing else (no internet, no provider). It holds the workspace's gateway app key and
    # its form-source signing key as secrets; browsers never see either.
    # Users reach it only through your SSO reverse proxy (oauth2-proxy or similar), which must also be attached to
    # appnet, strip any client-sent identity header and set X-Forwarded-Email. Give the proxy a fixed address and
    # list it (only it) in WS_TRUSTED_PROXIES: a request from any other peer gets 401.
    image: pgw-gateway:local          # same image as the gateway (the workspace is pgw/workspace)
    command: ["python", "-m", "pgw.workspace"]
    environment:
      WS_MODE: production
      WS_HOST: "0.0.0.0"
      WS_PORT: "8090"
      WS_GATEWAY_URL: "http://gateway:8080"
      WS_GATEWAY_KEY_FILE: /run/secrets/ws_gateway_key       # bearer key of app `hr-workspace` (registry/apps.yaml)
      WS_SOURCE_KEY_FILE: /run/secrets/ws_source_key         # hr-workspace-forms@1 private key (omit: forms off)
      WS_APP_ID: hr-workspace
      WS_MODEL: "${WS_MODEL:-claude-opus-5-5}"
      WS_PUBLIC_ORIGIN: "${WS_PUBLIC_ORIGIN:?the https origin users open, e.g. https://hr-workspace.example.com}"
      WS_TRUSTED_PROXIES: "${WS_TRUSTED_PROXIES:?the SSO reverse proxy address(es) on appnet}"
      WS_IDENTITY_HEADER: X-Forwarded-Email
      # WS_INTEGRATIONS_FILE: /run/secrets/ws_integrations   # helpdesk integrations allowed to submit signed tickets
    secrets: [ws_gateway_key, ws_source_key]
    networks: [appnet]                # appnet ONLY; never add egressnet
    depends_on: [gateway]
    read_only: true
    restart: unless-stopped

  pgw-private-llm:
    # In-house CPU LLM for the PRIVATE route (deploy/LLAMA_SERVER.md): llama.cpp's OpenAI-compatible llama-server.
    # STUB: enabled only with `docker compose --profile private-llm up`; no model ships with this repository.
    # The signed profile then sets private_upstream_url: http://pgw-private-llm:8080/v1 (host already in the default
    # private_allowlist), and PGW_PRIVATE_MODEL=${PGW_PRIVATE_MODEL_ALIAS} so it matches the --alias below.
    profiles: ["private-llm"]
    # Pinned tag AND digest (multi-arch index of server-b11723, ghcr.io/ggml-org/llama.cpp, MIT licence).
    image: ghcr.io/ggml-org/llama.cpp:server-b11723@sha256:143926008cbbbab8fae8fd87809875af3e42d3d676c30c11c55c0f3f683a5a07
    command:
      - "-m"
      - "/models/${PGW_PRIVATE_GGUF_FILE:?GGUF file name inside PGW_PRIVATE_GGUF_DIR}"
      - "--alias"
      - "${PGW_PRIVATE_MODEL_ALIAS:-hr-private-llm}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--threads"
      - "${LLAMA_THREADS:-8}"            # generation threads: physical cores given to this container
      - "--threads-batch"
      - "${LLAMA_THREADS:-8}"            # prompt processing threads
      - "--ctx-size"
      - "${LLAMA_CTX:-8192}"             # total KV cache, shared by the parallel slots
      - "--parallel"
      - "${LLAMA_PARALLEL:-2}"           # concurrent requests (slots); ctx per slot = ctx-size / parallel
      - "--no-webui"
    volumes:
      # The model file is mounted READ-ONLY; record its sha256 next to the deployment (deploy/LLAMA_SERVER.md).
      - "${PGW_PRIVATE_GGUF_DIR:?directory holding the GGUF model}:/models:ro"
    read_only: true
    tmpfs: [/tmp]
    cpus: "${LLAMA_CPUS:-8}"
    networks: [privatenet]            # ONLY the gateway can reach it; it has no route out
    restart: unless-stopped

networks:
  privatenet:
    internal: true                    # in-boundary model network: gateway <-> pgw-private-llm only, no route out
  appnet:
    internal: true                    # no route out: the core of the T13 control
  egressnet:
    driver: bridge                    # reachable only by services that explicitly attach it

volumes:
  pgw_state: {}

secrets:
  pgw_master_key:
    environment: PGW_MASTER_KEY       # compose >= 2.23; or use `file: ./secrets/pgw_master_key`
  ws_gateway_key:
    file: ./secrets/ws_gateway_key    # issue a key; register its sha256 for app hr-workspace; re-seal and sign
  ws_source_key:
    file: ./secrets/ws_source_key     # python -m pgw.product.attest keygen; pin its public key (docs/WORKSPACE.md)
