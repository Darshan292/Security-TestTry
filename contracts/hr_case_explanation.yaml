# Data contract: explain an HR case's status and next steps to the HR operator (PATH A, EXT_PSEUDO).
# Owner: HR helpdesk app team. Same class treatment as ticket summaries; restored output goes to HR staff only.
contract: hr_case_explanation
version: 6
task_type: hr_case_explanation
route: EXT_PSEUDO
data_classes:
  C1: ALIAS
  C2: ALIAS        # salary, DOB -> scoped aliases; the model never sees the value, the reply gets it back
  C3: REDACT
  C4: REFUSE
restore: [C1, C2]
purpose_dependent:
  leave_balance: PSEUDONYMISED_RAW        # leave cases cannot be explained without the balance
  attendance: PSEUDONYMISED_RAW
  performance_rating: NOT_EXPECTED
  health_or_leave_reason: NOT_EXPECTED    # medical reasons stay in the HRIS, not in the case text sent out
  disciplinary_outcome: NOT_EXPECTED
  eligibility_result: PSEUDONYMISED_RAW
  derived_compensation: NOT_EXPECTED
max_chars: 20000
declared_subjects:          # people the app knows are involved; protected without relying on detection
  required: [requester]
  roles: {requester: 1, assignee: 1, mentioned: 20, other: 10}
  fields: {name: PERSON, employee_id: EMPLOYEE_ID, email: EMAIL, phone: PHONE}
guidance: >-
  Answer in three labelled parts. 1) Facts: only what the case text states. 2) Possible causes to verify: you have
  no access to the payroll or HR systems, so every cause is a hypothesis; label it as such, list at most three, and
  never state one as the conclusion. 3) Next steps: concrete checks HR Operations can make to find the actual cause.
  Do not invent system names, timelines, codes or policies that are not in the case. Keep it under 200 words.
# Source-side input boundary (SECURITY_BOUNDARY.md §4). The NOT_EXPECTED stances above are NOT detected by the
# gateway. Free text reaches the external model only with a valid Ed25519 signature, by the key pinned here, over
# this purpose, the source id, a fresh timestamp and the request's messages and pgw_subjects (pgw.product.attest).
# That proves which source produced the content, not that its sanitizer removed anything.
# Without a valid signature: in-boundary model only (needs a configured private endpoint; an operator without one
# sets REFUSE and re-signs).
# THE KEY BELOW IS A DEMO KEY (its private half is committed in tests/fixtures). Production refuses to start with it:
# generate your source's key (python -m pgw.product.attest keygen KEYFILE), put the public key here and re-sign.
external_input:
  sanitizers:
    hris-case-export@1: "e6ed0bedd45b9b37ae920bdc53e9970c83924ae7c2bd175fb0a01a267d5a821d"
  unattested: PRIVATE
