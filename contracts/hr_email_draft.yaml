# Data contract: draft an email from HR to an employee (PATH A, EXT_PSEUDO).
# Owner: HR helpdesk app team. The draft is restored for a human to review and send; it is never auto-sent.
contract: hr_email_draft
version: 7
task_type: hr_email_draft
route: EXT_PSEUDO
data_classes:
  C1: ALIAS
  C2: ALIAS        # salary, DOB -> scoped aliases; the model never sees the value, the reply gets it back
  C3: REDACT
  C4: REFUSE
restore: [C1, C2]
purpose_dependent:
  leave_balance: PSEUDONYMISED_RAW
  attendance: NOT_EXPECTED
  performance_rating: NOT_EXPECTED
  health_or_leave_reason: NOT_EXPECTED
  disciplinary_outcome: NOT_EXPECTED
  eligibility_result: PSEUDONYMISED_RAW
  derived_compensation: NOT_EXPECTED
max_chars: 8000
declared_subjects:          # people the app knows are involved; protected without relying on detection
  required: [recipient]
  roles: {recipient: 1, mentioned: 10, other: 5}
  fields: {name: PERSON, employee_id: EMPLOYEE_ID, email: EMAIL, phone: PHONE}
# The sender is the HR Operations team (organisational, C0). Its contacts are declared here so they are never
# confused with the recipient's own contacts; they are held out of detection and cross as is.
org_contacts: ["hr-ops@kestrel-dyn.in", "+91 80 4000 1234"]
guidance: >-
  You are writing on behalf of HR Operations, Kestrel Dynamics. The recipient is the employee named in the request.
  The only contact details for reaching HR are hr-ops@kestrel-dyn.in and +91 80 4000 1234 (HR helpdesk). Never
  present the recipient's own email address, phone number or employee ID as a way to contact HR. Sign the email as
  "HR Operations, Kestrel Dynamics". Do not add template fillers such as [Company Name]. Placeholders carry no
  gender: greet the recipient as "Dear" followed by the placeholder, with no Mr/Ms/Mrs, and use pronouns only if
  the request itself uses them. Amounts and dates appear as placeholders such as [COMPENSATION_...]; copy
  them exactly where the amount belongs (they are replaced by the real value after your reply). Output only the email (subject line and
  body), ready to send after human review.
# Source-side input boundary (SECURITY_BOUNDARY.md §4). The NOT_EXPECTED stances above are NOT detected by the
# gateway. Free text reaches the external model only with a valid Ed25519 signature, by the key pinned here, over
# this purpose, the source id, a fresh timestamp and the request's messages and pgw_subjects (pgw.product.attest).
# That proves which source produced the content, not that its sanitizer removed anything.
# Without a valid signature: in-boundary model only (needs a configured private endpoint; an operator without one
# sets REFUSE and re-signs).
# THE KEY BELOW IS A DEMO KEY (its private half is committed in tests/fixtures). Production refuses to start with it:
# generate your source's key (python -m pgw.product.attest keygen KEYFILE), put the public key here and re-sign.
external_input:
  sanitizers:
    hr-email-composer@1: "836eb89434c1ae57216a94529c1501bd9217fe24cbfc912a1c1f2d2bd5798d43"
  unattested: PRIVATE
