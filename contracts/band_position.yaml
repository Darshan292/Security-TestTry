# Data contract: explain where an employee sits in their pay band (LOCAL_COMPUTE). The exact CTC stays inside
# the gateway; only a coarse position (which third of the band) crosses, next to an aliased identity.
contract: band_position
version: 3
task_type: pay_band_position_explanation
route: LOCAL_COMPUTE
compute: band_position
data_classes:
  C1: ALIAS
  C2: GENERALIZE
  C3: REDACT
  C4: REFUSE
restore: [C1, D]
purpose_dependent:
  leave_balance: NOT_EXPECTED
  attendance: NOT_EXPECTED
  performance_rating: NOT_EXPECTED
  health_or_leave_reason: NOT_EXPECTED
  disciplinary_outcome: NOT_EXPECTED
  eligibility_result: NOT_EXPECTED
  derived_compensation: LOCAL_ONLY
max_chars: 3000
input_schema:
  instruction: {type: str, max_len: 500}
  employee:
    type: list
    min: 1
    max: 1
    items:
      name: {type: str, max_len: 100, class: C1, entity: PERSON}
      employee_id: {type: str, max_len: 20, class: C1, entity: EMPLOYEE_ID}
      annual_ctc: {type: int, min: 1, max: 1000000000, class: C2, entity: COMPENSATION}
  band:
    type: list
    min: 1
    max: 1
    items:
      name: {type: str, max_len: 8, class: C0, one_of: pay_bands}   # limits come from the sealed table below
# Company pay bands (public policy, C0). Sealed with the contract: callers name a band, they never supply limits.
reference:
  pay_bands:
    P1: [600000, 1000000]
    P2: [1000000, 1800000]
    P3: [1800000, 2600000]
    P4: [2600000, 4000000]
outputs:
  employee_name: {derived_from: C1, egress: TRANSFORMED, entity: PERSON}
  employee_id: {derived_from: C1, egress: TRANSFORMED, entity: EMPLOYEE_ID}
  band_name: {derived_from: C0, egress: RAW}
  band_min: {derived_from: C0, egress: RAW}
  band_max: {derived_from: C0, egress: RAW}
  position:
    derived_from: C2
    egress: RAW
    justification: >-
      The explanation must say which third of the published band the employee is in; this narrows the CTC to a
      third of a public range next to an aliased identity. The exact CTC, percentage and headroom stay INTERNAL.
  pct_through_band: {derived_from: C2, egress: INTERNAL}
  annual_ctc: {derived_from: C2, egress: INTERNAL}
  headroom: {derived_from: C2, egress: INTERNAL}
prompt_template: |
  {instruction}

  Facts computed inside the privacy gateway (the employee's exact CTC is not shared with you):
  - Employee: {employee_name} ({employee_id}), pay band {band_name} ({band_min} to {band_max} per year).
  - Position: the employee's CTC is {position}.
  Write the explanation for the HR manager using only these facts.
# Source-side input boundary (SECURITY_BOUNDARY.md §4). The NOT_EXPECTED stances above are NOT detected by the
# gateway. Free text reaches the external model only if the calling app sends X-PGW-Input-Source naming one of these
# source-side sanitizers/exports (an attestation by the app owner, recorded in the audit ledger; the gateway does not
# verify the content). Without it: refused (422), nothing sent.
external_input:
  sanitizers: [band-review-form@1]
  unattested: REFUSE
