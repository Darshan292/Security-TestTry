# Data contract: HR/payroll ticket summarisation (PATH A, PRODUCT_ARCHITECTURE §2).
# Owner: HR helpdesk app team. Language work over business content; identities are aliased and restored;
# government/financial identifiers are not needed for a summary, so they are removed, not blocked.
contract: ticket_summary
version: 5
task_type: hr_ticket_summary
route: EXT_PSEUDO
data_classes:
  C1: ALIAS        # names, employee IDs, emails, phones -> scoped aliases
  C2: GENERALIZE   # salary, DOB -> bands, never exact
  C3: REDACT       # PAN, Aadhaar, bank account, card, UPI, secrets -> removed
  C4: REFUSE       # non-Latin-script personal text: no private route yet
restore: [C1]
# Purpose-dependent personal attributes. Detectors cannot see these; the stance is an obligation on the app
# and a statement of what the provider may receive next to aliased identities (still personal data).
purpose_dependent:
  leave_balance: PSEUDONYMISED_RAW        # tickets about leave need the balance to be summarised
  attendance: PSEUDONYMISED_RAW
  performance_rating: NOT_EXPECTED
  health_or_leave_reason: NOT_EXPECTED    # medical detail must not be in helpdesk tickets sent for summary
  disciplinary_outcome: NOT_EXPECTED
  eligibility_result: PSEUDONYMISED_RAW
  derived_compensation: NOT_EXPECTED
max_chars: 20000
declared_subjects:          # people the app knows are involved; protected without relying on detection
  required: [requester]
  roles: {requester: 1, assignee: 1, mentioned: 20, other: 10}
  fields: {name: PERSON, employee_id: EMPLOYEE_ID, email: EMAIL, phone: PHONE}
# Source-side input boundary (SECURITY_BOUNDARY.md §4). The NOT_EXPECTED stances above are NOT detected by the
# gateway. Free text reaches the external model only with a valid Ed25519 signature, by the key pinned here, over
# this purpose, the source id, a fresh timestamp and the request's messages and pgw_subjects (pgw.product.attest).
# That proves which source produced the content, not that its sanitizer removed anything.
# Without a valid signature: in-boundary model only (needs a configured private endpoint; an operator without one
# sets REFUSE and re-signs).
# THE KEY BELOW IS A DEMO KEY (its private half is committed in tests/fixtures). Production refuses to start with it:
# generate your source's key (python -m pgw.product.attest keygen KEYFILE), put the public key here and re-sign.
external_input:
  sanitizers:
    helpdesk-ticket-export@1: "2d8e205442997cadefc51d732902532d7a81d3edaa1bada9d5c383cfd4f30cec"
  unattested: PRIVATE
