# Data contract: compare two employees' pay (PATH B, LOCAL_COMPUTE).
# Exact CTC values arrive as structured C2 fields, are used only inside the gateway, and never leave it.
# Every computed output has an explicit egress rule; anything unlisted is INTERNAL.
contract: salary_comparison
version: 5
task_type: salary_comparison
route: LOCAL_COMPUTE
compute: salary_difference
data_classes:
  C1: ALIAS
  C2: GENERALIZE   # applies to free text (the instruction); structured C2 inputs are withheld entirely
  C3: REDACT
  C4: REFUSE
restore: [C1, D]   # identities and TRANSFORMED derived values come back exact for the HR manager
purpose_dependent:
  leave_balance: NOT_EXPECTED
  attendance: NOT_EXPECTED
  performance_rating: NOT_EXPECTED
  health_or_leave_reason: NOT_EXPECTED
  disciplinary_outcome: NOT_EXPECTED
  eligibility_result: NOT_EXPECTED
  derived_compensation: LOCAL_ONLY        # pay differences are personal compensation data
max_chars: 4000
input_schema:
  instruction: {type: str, max_len: 500}
  employees:
    type: list
    min: 2
    max: 2
    items:
      name: {type: str, max_len: 100, class: C1, entity: PERSON}
      employee_id: {type: str, max_len: 20, class: C1, entity: EMPLOYEE_ID}
      annual_ctc: {type: int, min: 1, max: 1000000000, class: C2, entity: COMPENSATION}
outputs:
  higher_name: {derived_from: C1, egress: TRANSFORMED, entity: PERSON}
  higher_id: {derived_from: C1, egress: TRANSFORMED, entity: EMPLOYEE_ID}
  lower_name: {derived_from: C1, egress: TRANSFORMED, entity: PERSON}
  lower_id: {derived_from: C1, egress: TRANSFORMED, entity: EMPLOYEE_ID}
  difference: {derived_from: C2, egress: TRANSFORMED}     # aliased; the model never sees the amount
  pct_of_lower: {derived_from: C2, egress: TRANSFORMED}   # relative pay of two people is still personal
  ranking: {derived_from: C2, egress: RAW, justification: "one of two fixed sentences: which listed employee earns more, or that both are equal; carries no amount"}
  difference_value: {derived_from: C2, egress: INTERNAL}
  higher_ctc: {derived_from: C2, egress: INTERNAL}
  lower_ctc: {derived_from: C2, egress: INTERNAL}
prompt_template: |
  {instruction}

  Facts computed inside the privacy gateway from exact HRIS data (exact salaries are not shared with you):
  - Employees compared: {higher_name} ({higher_id}) and {lower_name} ({lower_id}).
  - {ranking}
  - The difference is {difference} per year, which is {pct_of_lower} of the lower CTC.
  Write the answer for the HR manager using only these facts.
# Source-side input boundary (SECURITY_BOUNDARY.md §4). The NOT_EXPECTED stances above are NOT detected by the
# gateway. Free text reaches the external model only with a valid Ed25519 signature, by the key pinned here, over
# this purpose, the source id, a fresh timestamp and the request's messages and pgw_subjects (pgw.product.attest).
# That proves which source produced the content, not that its sanitizer removed anything.
# Without a valid signature: refused (422), nothing sent.
# THE KEY BELOW IS A DEMO KEY (its private half is committed in tests/fixtures). Production refuses to start with it:
# generate your source's key (python -m pgw.product.attest keygen KEYFILE), put the public key here and re-sign.
external_input:
  sanitizers:
    comp-review-form@1: "fbcf8d3fd275bc11b9770d7a7ea4e43080346f1779ce9502e0c1e0c98ea63e1d"
  unattested: REFUSE
