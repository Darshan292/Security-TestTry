# App registry (ADR-0004): who may call, for which declared purposes, on which models.
# key_sha256 = sha256 of the app's bearer key. Sealed in policies/MANIFEST.json like policies and contracts: any edit
# (an added purpose or model, a key hash) needs a re-seal, and production needs that seal signed (SECURITY_BOUNDARY.md).
# Every purpose MUST be bound to a data contract under `tasks`; an uncontracted purpose stops startup.
# `transparency: true` opts an app in to the pgw_report (default false); like every field here it is sealed.
version: 4
apps:
  # PILOT (product slice). The demo key below is "pilot-hr-helpdesk-key-change-me"; replace it.
  - app_id: hr-helpdesk-pilot
    tenant: acme
    key_sha256: 3254cb5f99c34b1023cdda3f71688bf2e5ee5dd23cbdf557c8a8549ac10f6206
    purposes: [ticket_summary, hr_case_explanation, hr_email_draft, salary_comparison, esi_letter, band_position]
    tasks:
      ticket_summary: ../contracts/ticket_summary.yaml
      hr_case_explanation: ../contracts/hr_case_explanation.yaml
      hr_email_draft: ../contracts/hr_email_draft.yaml
      salary_comparison: ../contracts/salary_comparison.yaml
      esi_letter: ../contracts/esi_letter.yaml
      band_position: ../contracts/band_position.yaml
    restore_output: true
    models: [mock-1, claude-opus-5-5, openai/gpt-oss-120b]
    # Transparency report (docs/TRANSPARENCY_REPORT.md): what the gateway did with each request, returned only to
    # this app in its own responses (never logged, never in the ledger, never upstream). Default false.
    transparency: true
  # HR Workspace (pgw/workspace, docs/WORKSPACE.md): the staff-facing UI's backend. It holds this key server-side;
  # browsers never see it. It signs only the structured LOCAL_COMPUTE forms (source hr-workspace-forms@1) and sends
  # pasted free text unattested, so the contracts keep that inside (in-house model). The demo key below is
  # "hr-workspace-key-change-me"; replace it. transparency: the gateway returns its pgw_report to this app only.
  - app_id: hr-workspace
    tenant: acme
    key_sha256: 8c1f9a3aab639bf4053a5d571c98abcb67c994db59d095c4920985c38c0e4973
    purposes: [ticket_summary, hr_case_explanation, hr_email_draft, salary_comparison, esi_letter, band_position]
    tasks:
      ticket_summary: ../contracts/ticket_summary.yaml
      hr_case_explanation: ../contracts/hr_case_explanation.yaml
      hr_email_draft: ../contracts/hr_email_draft.yaml
      salary_comparison: ../contracts/salary_comparison.yaml
      esi_letter: ../contracts/esi_letter.yaml
      band_position: ../contracts/band_position.yaml
    restore_output: true
    transparency: true
    models: [mock-1, claude-opus-5-5, openai/gpt-oss-120b]
  # HRMS connector (docs/HRMS_CONTRACTS.md): sends whole HRMS exports (payroll register, timecards, Fieldglass,
  # directory) on the RECORDS route. Values are classified by the sealed field schemas in registry/schemas; only
  # computed results and aliased identities leave. Payloads must be signed by the export's source key
  # (hrms-export@1, a DEMO key in the shipped contracts). The demo key below is "hrms-connector-key-change-me".
  - app_id: hrms-connector
    tenant: acme
    key_sha256: a3e9d666b7c93ae1e39aca3db3b82f9941b3111f8c91a853ef25f5a75d51e2c7
    purposes: [payroll_register_check, timecard_exceptions, contractor_budget, roster_question]
    tasks:
      payroll_register_check: ../contracts/payroll_register_check.yaml
      timecard_exceptions: ../contracts/timecard_exceptions.yaml
      contractor_budget: ../contracts/contractor_budget.yaml
      roster_question: ../contracts/roster_question.yaml
    restore_output: true
    transparency: true
    models: [mock-1, claude-opus-5-5, openai/gpt-oss-120b]
