# Small-group disclosure control for every RECORDS contract (pgw/product/disclosure.py, docs/HRMS_CONTRACTS.md
# "Small groups", SECURITY_BOUNDARY.md §12). Sealed and signed like every rules file: a modified, unsealed or missing
# file stops startup. A change needs review, a version bump and a re-seal (OPERATIONS.md).
kind: pgw-disclosure-control
config: disclosure_control
version: 3
# k: no count of 1..k-1 people defined by quasi-identifiers leaves, and every listed alias's leaving attributes are
# shared by at least k people. Below 3 only with `min_group_size_override: {justification: "..."}` (reviewed).
# A contract may raise it (records.min_group_size), never lower it.
min_group_size: 5
# Listings: coarsen (hierarchies below and the built-in ones: month -> year -> 5-year range, PIN 560xxx -> 56xxxx,
# then drop the column; rows that still fail show "attributes withheld") | withhold (no coarsening) | alias_only
# (no attributes next to aliases at all).
listing: coarsen
# Durable audit history per (tenant, dataset): shared by every app and every RECORDS purpose of the tenant over the
# same dataset (the provider sees all of them), not per conversation (conversation ids are caller-chosen). Keeps
# every cell any answer revealed -- printed counts AND suppression markers -- as keyed record hashes, and audits the
# whole scope as linear constraints over record sets (pgw/product/setaudit.py): no group of 1..k-1 records may have
# its size determined by any combination of answers. A response that would break this has more secondary cells
# suppressed, or is refused. Capacity: when a scope is full, or a caller has used its budget, only NEW information is
# refused (questions already answered are still answered). Operator compaction keeps every record set (never
# reopens a gap): python -m pgw.product.disclosure history compact ... SECURITY_BOUNDARY.md §12.
differencing:
  enabled: true
  scope:
    separate_apps: false             # true (with a justification) gives each app its own history: weaker
    separate_purposes: false         # true (with a justification) gives each purpose its own history: weaker
  per_caller:                        # caller = the authenticated app (the gateway has no end-user identity)
    new_queries_per_minute: 20       # per gateway process
    new_queries_per_day: 500         # shared by every process (day counter in the history)
  max_stored_keys_per_scope: 2000000 # record hashes kept per scope (16 bytes each)
  max_cells_per_scope: 100000        # distinct revealed record sets per scope
  max_atoms_per_scope: 20000         # bounds the audit's cost
  query_log_per_scope: 10000         # metadata rows kept (predicate HMACs, day numbers); older rows compacted
  max_scopes: 10000
  audit_budget: 400000               # search steps per audit; exhausted -> the response is refused (fail closed)
  audit_max_ms: 1500                 # wall-clock bound of one response's audit; exceeded -> refused (reason audit_budget)
# Deterministic rounding of published roster counts to a base ("about 15"). Off: the audit above is the control (it
# treats rounded counts as intervals when on); listings print every matching alias anyway (docs/HRMS_CONTRACTS.md
# "Small groups").
rounding:
  enabled: false
  base: 5
# Quasi-identifiers: by default every KEEP and GENERALIZE field of a schema (every field whose value can leave).
# A schema block may only ADD names. Hierarchies: roll-ups of a KEEP enumeration, finest first (STARTER mapping:
# replace with your organisation's reference table and re-seal).
# record_key (per schema): the dataset-level record identity of the history (the same for every contract over the
# schema) and its normalisation. Default: the schema's first employee-identifier field with NFKC, whitespace and
# invisible characters removed, casefold, DOMAIN\ prefix and @UPN suffix stripped; leading zeros of an all-digit id
# are stripped only if configured (strip_leading_zeros: true).
schemas:
  ad_user:
    record_key:
      fields: [username]
      normalise:
        username: {casefold: true, strip_domain: true, strip_upn_suffix: true, strip_leading_zeros: false}
    quasi_identifiers: []
    hierarchies:
      department:
        - {Finance: Corporate functions, Legal: Corporate functions, Human Resources: Corporate functions,
           Administration: Corporate functions, Engineering: Engineering and operations,
           Operations: Engineering and operations, Manufacturing: Engineering and operations,
           Sales: Customer-facing, Marketing: Customer-facing, Support: Customer-facing}
